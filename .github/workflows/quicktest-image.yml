name: Quick test image

# Builds Containerfile.quicktest from the chosen branch and pushes it to the
# container registry of this repository as <repository>:quicktest (and
# :quicktest-<commit>). Started by hand only: the build compiles FFmpeg and
# takes a while.

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "latest=${image}:quicktest"
            echo "commit=${image}:quicktest-$(git rev-parse --short=9 HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          platforms: linux/amd64
          context: .
          file: Containerfile.quicktest
          push: true
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.commit }}
